name: Build RSS

on:
  schedule:
    - cron: '0 */2 * * *'    # 每 2 小时跑一次
  workflow_dispatch:          # 支持手动触发
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Discover HTML structures
        run: node discover.js
      - name: Generate feeds
        run: node generate.js
      - name: Commit feeds
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "update feeds"
          git push
